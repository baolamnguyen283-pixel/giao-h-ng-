 
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giao Hàng 2D 🛵</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172033;color:white;font-family:Arial,sans-serif;text-align:center}
h1{margin:12px 0;color:#ffe082}
#info{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px}
canvas{display:block;width:min(96vw,800px);height:auto;margin:auto;border:3px solid white;border-radius:12px;background:#80c96b}
button{border:0;border-radius:12px;padding:13px 19px;font-size:17px;font-weight:bold;cursor:pointer;background:#ffcf56;color:#243047}
#controls{display:flex;justify-content:center;gap:10px;margin:12px auto;flex-wrap:wrap;max-width:360px}
#controls button{width:65px;height:55px;font-size:24px;touch-action:none}
#message{min-height:24px;color:#ffe082;font-weight:bold}
</style>
</head>
<body>
<h1>🛵 GIAO HÀNG 2D</h1>
<div id="info">
<span>📦 Đơn: <b id="orders">0</b></span>
<span>💰 Tiền: <b id="money">0</b>k</span>
<span>⭐ Điểm: <b id="score">0</b></span>
</div>
<canvas id="game" width="800" height="520"></canvas>
<div id="message">Nhận gói hàng màu vàng rồi giao đến điểm màu hồng!</div>
<div id="controls">
<button data-key="ArrowUp">⬆️</button>
<button data-key="ArrowLeft">⬅️</button>
<button data-key="ArrowDown">⬇️</button>
<button data-key="ArrowRight">➡️</button>
</div>
<button id="restart">🔄 Chơi lại</button>
<p>Điều khiển bằng WASD, phím mũi tên hoặc các nút bên trên.</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const W=c.width,H=c.height;
const keys={};
let player,packagePos,target,money,orders,score,gameOver,delivered;
const buildings=[
[25,25,110,75],[185,25,100,75],[350,25,115,75],[525,25,105,75],[675,25,100,75],
[25,400,110,85],[185,400,100,85],[350,400,115,85],[525,400,105,85],[675,400,100,85],
[25,150,110,75],[665,150,110,75],[25,280,110,75],[665,280,110,75]
];
function reset(){
player={x:400,y:260,a:0,speed:0};
packagePos={x:400,y:125};target={x:600,y:260};
money=0;orders=0;score=0;gameOver=false;delivered=false;
document.getElementById("message").textContent="Đi lấy gói hàng màu vàng!";
updateInfo();
}
function updateInfo(){
document.getElementById("orders").textContent=orders;
document.getElementById("money").textContent=money;
document.getElementById("score").textContent=score;
}
function circle(x,y,r,color){
ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function drawRoad(){
ctx.fillStyle="#80c96b";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#666d78";ctx.fillRect(0,110,W,280);
ctx.fillStyle="#f8e9a1";
for(let x=0;x<W;x+=70){ctx.fillRect(x,246,38,5);ctx.fillRect(x,270,38,5)}
for(const [x,y,w,h] of buildings){
ctx.fillStyle="#39445b";ctx.fillRect(x+5,y+7,w,h);
ctx.fillStyle=["#ffadad","#a0c4ff","#ffd6a5","#caffbf","#d7baff"][Math.floor(x/20+y/10)%5];
ctx.fillRect(x,y,w,h);
ctx.fillStyle="#fff1bd";
for(let wx=x+12;wx<x+w-8;wx+=28)
for(let wy=y+12;wy<y+h-8;wy+=26)ctx.fillRect(wx,wy,12,12);
ctx.fillStyle="#7b5545";ctx.fillRect(x+w/2-10,y+h-24,20,24);
}
}
function drawPackage(){
circle(packagePos.x,packagePos.y,19,"#ffe082");
ctx.fillStyle="#805b25";ctx.fillRect(packagePos.x-10,packagePos.y-8,20,17);
ctx.fillStyle="#fff1bd";ctx.fillRect(packagePos.x-2,packagePos.y-8,4,17);
ctx.fillStyle="white";ctx.font="bold 13px Arial";ctx.textAlign="center";
ctx.fillText("LẤY",packagePos.x,packagePos.y-27);
}
function drawTarget(){
circle(target.x,target.y,24,"#ff6fae");
circle(target.x,target.y,15,"#fff0f6");
circle(target.x,target.y,7,"#ff6fae");
ctx.fillStyle="white";ctx.font="bold 13px Arial";ctx.textAlign="center";
ctx.fillText("GIAO",target.x,target.y-32);
}
function drawPlayer(){
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);
ctx.fillStyle="#263238";ctx.fillRect(-17,-15,34,9);ctx.fillRect(-17,7,34,9);
ctx.fillStyle="#00b7d8";ctx.fillRect(-23,-10,46,20);
ctx.fillStyle="#fff";ctx.fillRect(1,-7,12,14);
ctx.fillStyle="#ffdf80";ctx.fillRect(15,-6,8,12);
ctx.fillStyle="#ef476f";ctx.beginPath();ctx.arc(-3,0,9,0,Math.PI*2);ctx.fill();
ctx.restore();
}
function blocked(x,y){
if(x<18||x>W-18||y<18||y>H-18)return true;
return buildings.some(([bx,by,bw,bh])=>x>bx-18&&x<bx+bw+18&&y>by-18&&y<by+bh+18);
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function randomRoadPoint(){
let p;
do{
p={x:130+Math.random()*540,y:125+Math.random()*265};
}while(blocked(p.x,p.y));
return p;
}
function frame(){
drawRoad();
if(!gameOver){
let dx=0,dy=0;
if(keys.ArrowUp||keys.w||keys.W)dy--;
if(keys.ArrowDown||keys.s||keys.S)dy++;
if(keys.ArrowLeft||keys.a||keys.A)dx--;
if(keys.ArrowRight||keys.d||keys.D)dx++;
if(dx||dy){
const len=Math.hypot(dx,dy);dx/=len;dy/=len;
player.a=Math.atan2(dy,dx);
let nx=player.x+dx*2.8,ny=player.y+dy*2.8;
if(!blocked(nx,player.y))player.x=nx;
if(!blocked(player.x,ny))player.y=ny;
}
if(!delivered&&distance(player,packagePos)<29){
delivered=true;
document.getElementById("message").textContent="Đã lấy hàng! Đi đến điểm giao màu hồng!";
}
if(delivered&&distance(player,target)<33){
money+=20;orders++;score+=100;delivered=false;
packagePos=randomRoadPoint();target=randomRoadPoint();
while(distance(packagePos,target)<130)target=randomRoadPoint();
document.getElementById("message").textContent="Giao hàng thành công! +20k 🎉";
updateInfo();
}
}
if(!delivered)drawPackage();
else drawTarget();
if(delivered)drawTarget();
drawPlayer();
if(gameOver){
ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,W,H);
ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 36px Arial";
ctx.fillText("KẾT THÚC",W/2,H/2);
}
requestAnimationFrame(frame);
}
document.addEventListener("keydown",e=>{
if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
keys[e.key]=true;
});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll("[data-key]").forEach(btn=>{
const k=btn.dataset.key;
btn.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;btn.setPointerCapture(e.pointerId)});
btn.addEventListener("pointerup",()=>keys[k]=false);
btn.addEventListener("pointercancel",()=>keys[k]=false);
btn.addEventListener("lostpointercapture",()=>keys[k]=false);
});
document.getElementById("restart").addEventListener("click",reset);
reset();frame();
</script>
</body>
</html>

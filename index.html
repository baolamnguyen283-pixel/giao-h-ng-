 
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giao Hàng 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#8bd0f4;overflow:hidden}
canvas{display:block}
#game{width:100vw;height:100vh}
.panel{position:fixed;background:#142331ee;color:white;padding:12px;border-radius:12px;z-index:2}
#top{top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
#info{top:75px;left:10px;width:180px;font-size:13px}
#map{right:10px;bottom:110px;width:110px;height:110px;background:#cbd5c8;border:2px solid white}
button,input,select{padding:10px;border:0;border-radius:8px;margin:3px}
button{background:#ffca45;font-weight:bold;cursor:pointer;touch-action:none}
#controls{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}
#controls button{min-width:42px;min-height:42px}
#start{position:fixed;inset:0;background:#102b3bea;color:white;z-index:5;display:grid;place-items:center;padding:15px;text-align:center}
#box{background:#173b4b;padding:25px;border-radius:20px;width:min(400px,100%)}
#box input,#box select{width:100%;margin:6px 0}
@media(max-width:500px){#info{width:150px;font-size:11px;padding:8px}#map{width:90px;height:90px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top" class="panel">
  <b>🏍️ GIAO HÀNG 3D<br><span id="driver">Tài xế</span></b>
  <span>📦 <b id="score">0/5</b><br>💰 <b id="money">0đ</b></span>
</div>

<div id="info" class="panel">
  <b>📱 NHIỆM VỤ</b><hr>
  <div id="mission">Bắt đầu để nhận đơn.</div>
  <p id="status">Chọn Bắt đầu chơi.</p>
  <button onclick="toggleRide()">🏍️ Lên/xuống xe</button>
  <button onclick="interact()">📦 Nhận/Giao (G)</button>
  <p>WASD hoặc phím mũi tên để lái xe.</p>
</div>

<canvas id="map" width="180" height="180"></canvas>

<div id="controls">
  <div>
    <div><button data-key="ArrowUp">⬆️</button></div>
    <button data-key="ArrowLeft">⬅️</button>
    <button data-key="ArrowDown">⬇️</button>
    <button data-key="ArrowRight">➡️</button>
  </div>
  <button onclick="toggleRide()">🏍️ Lên/xuống xe</button>
</div>

<div id="start">
  <div id="box">
    <div style="font-size:45px">🏍️📦🏙️</div>
    <h1>GIAO HÀNG 3D</h1>
    <p>Lái xe nhận đơn và giao hàng kiếm tiền!</p>
    <input id="name" maxlength="20" placeholder="Tên tài xế">
    <select id="difficulty">
      <option value="1">🌱 Dễ</option>
      <option value="1.5">🔥 Khó</option>
    </select>
    <button style="width:100%" onclick="startGame()">BẮT ĐẦU CHƠI ▶</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const map=document.getElementById("map");
const mc=map.getContext("2d");

let W,H,scale;
function resize(){
  W=innerWidth; H=innerHeight;
  scale=Math.min(devicePixelRatio||1,2);
  canvas.width=W*scale; canvas.height=H*scale;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(scale,0,0,scale,0,0);
}
addEventListener("resize",resize);resize();

let running=false,riding=false,keys={};
let speedFactor=1,last=0,money=0,delivered=0;
const player={x:0,z:0,a:0};

const places=[
 {x:0,z:300,name:"Bưu điện",icon:"🏤"},
 {x:100,z:600,name:"Quán cà phê",icon:"☕"},
 {x:-100,z:900,name:"Siêu thị",icon:"🛒"},
 {x:100,z:1200,name:"Nhà hàng",icon:"🍜"},
 {x:-100,z:1500,name:"Cửa hàng",icon:"🏪"},
 {x:100,z:1800,name:"Khách sạn",icon:"🏨"},
 {x:-100,z:2100,name:"Công viên",icon:"🌳"}
];

let order=null,phase="pickup";

function startGame(){
 document.getElementById("start").style.display="none";
 document.getElementById("driver").textContent=
   document.getElementById("name").value.trim()||"Tài xế";
 speedFactor=Number(document.getElementById("difficulty").value);
 running=true;
 newMission();
 last=0;
 requestAnimationFrame(loop);
}

function newMission(){
 if(delivered>=5){
  order=null;
  document.getElementById("mission").textContent="🏆 Hoàn thành 5 đơn!";
  document.getElementById("status").textContent="Bạn đã thắng!";
  return;
 }
 let a=Math.floor(Math.random()*places.length),b;
 do{b=Math.floor(Math.random()*places.length)}while(a===b);
 order={from:places[a],to:places[b]};
 phase="pickup";
 updateMission();
}

function updateMission(){
 if(!order)return;
 let p=phase==="pickup"?order.from:order.to;
 document.getElementById("mission").innerHTML=
 (phase==="pickup"?"📦 Đến nhận hàng:":"🎯 Đến giao hàng:")+
 "<br><b>"+p.icon+" "+p.name+"</b>";
 document.getElementById("status").textContent=
 phase==="pickup"?"Lái đến điểm nhận hàng.":"Đã nhận hàng, đi giao cho khách!";
}

function toggleRide(){
 if(!running)return;
 riding=!riding;
 document.getElementById("status").textContent=
 riding?"Đã lên xe! Dùng W hoặc ↑ để chạy.":"Đã xuống xe.";
}

function interact(){
 if(!running||!order)return;
 const p=phase==="pickup"?order.from:order.to;
 if(Math.hypot(player.x-p.x,player.z-p.z)>110){
  document.getElementById("status").textContent=
   "Chưa đến nơi! Hãy lái gần điểm nhiệm vụ.";
  return;
 }
 if(phase==="pickup"){
  phase="drop";updateMission();
 }else{
  delivered++;money+=20000;
  document.getElementById("score").textContent=delivered+"/5";
  document.getElementById("money").textContent=
   money.toLocaleString("vi-VN")+"đ";
  newMission();
 }
}

function move(dt){
 if(!riding)return;
 const forward=(keys.ArrowUp||keys.w||keys.W?1:0)-
               (keys.ArrowDown||keys.s||keys.S?1:0);
 const turn=(keys.ArrowRight||keys.d||keys.D?1:0)-
            (keys.ArrowLeft||keys.a||keys.A?1:0);
 player.a+=turn*2*dt;
 const velocity=forward*190*speedFactor*dt;
 player.x+=Math.sin(player.a)*velocity;
 player.z+=Math.cos(player.a)*velocity;

 // Giới hạn xe trong khu vực chơi, không khóa điểm xuất phát.
 player.x=Math.max(-240,Math.min(240,player.x));
 player.z=Math.max(-50,Math.min(2600,player.z));
}

function project(x,z){
 const dx=x-player.x,dz=z-player.z;
 const ca=Math.cos(player.a),sa=Math.sin(player.a);
 const depth=dx*sa+dz*ca;
 const side=dx*ca-dz*sa;
 if(depth<20)return null;
 const s=380/depth;
 return {x:W/2+side*s,y:H*.48-175*s,s,depth};
}

function polygon(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fill();
}

function building(x,z,n){
 const p=project(x,z);
 if(!p||p.s<.025||p.s>4||p.x<-150||p.x>W+150)return;
 const w=65*p.s,h=(95+(n%3)*15)*p.s;
 ctx.fillStyle=["#d6e4e8","#e9cfb1","#bdcfc2","#cbd8e1"][n%4];
 ctx.fillRect(p.x-w/2,p.y-h,w,h);
 ctx.fillStyle="#59788b";
 for(let r=0;r<3;r++)for(let c=0;c<2;c++){
  ctx.fillRect(p.x-w*.27+c*w*.42,
    p.y-h+(14+r*22)*p.s,
    Math.max(2,8*p.s),Math.max(2,10*p.s));
 }
}

function drawWorld(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#69b9f5");
 sky.addColorStop(.55,"#d5eff9");
 sky.addColorStop(.56,"#8aa875");
 sky.addColorStop(1,"#53614d");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // Đường rộng, có lề hai bên.
 polygon([[W*.42,H*.53],[W*.58,H*.53],[W*1.08,H],[W*-.08,H]],"#484f53");
 polygon([[W*.42,H*.53],[W*.44,H*.53],[W*.23,H],[W*.04,H]],"#8aa875");
 polygon([[W*.56,H*.53],[W*.58,H*.53],[W*.96,H],[W*.77,H]],"#8aa875");

 // Nhà nằm ngoài lề đường.
 for(let z=Math.floor((player.z+100)/140)*140;
     z<player.z+1800;z+=140){
  const n=Math.floor(z/140);
  building(-190,z,n*2+1);
  building(190,z,n*2+2);
 }

 // Vạch giữa đường.
 for(let z=Math.floor((player.z+80)/100)*100;
     z<player.z+1000;z+=100){
  const p=project(0,z);
  if(p){
   ctx.fillStyle="#ffe9a0";
   ctx.fillRect(p.x-2*p.s,p.y,Math.max(2,4*p.s),Math.max(3,32*p.s));
  }
 }

 // Điểm nhận/giao hàng.
 if(order){
  const p=phase==="pickup"?order.from:order.to;
  const pt=project(p.x,p.z);
  if(pt&&pt.depth<1500){
   ctx.textAlign="center";
   ctx.font="bold "+Math.max(14,24*pt.s)+"px Arial";
   ctx.fillStyle="white";
   ctx.fillText(phase==="pickup"?"📦":"🎯",pt.x,pt.y-25*pt.s);
   ctx.fillText(p.name,pt.x,pt.y-45*pt.s);
  }
 }

 // Hình xe ở phía dưới màn hình.
 if(riding){
  polygon([[W*.24,H],[W*.35,H*.8],[W*.65,H*.8],[W*.76,H]],"#242a30");
  ctx.fillStyle="#e33e48";
  ctx.fillRect(W*.44,H*.82,W*.12,H*.07);
  ctx.strokeStyle="#111";ctx.lineWidth=7;ctx.beginPath();
  ctx.moveTo(W*.5,H*.85);ctx.lineTo(W*.31,H*.77);
  ctx.moveTo(W*.5,H*.85);ctx.lineTo(W*.69,H*.77);
  ctx.stroke();
 }else{
  ctx.textAlign="center";ctx.font="40px Arial";
  ctx.fillText("🧍",W/2,H*.8);
 }
}

function drawMap(){
 mc.clearRect(0,0,180,180);
 mc.fillStyle="#cbd5c8";mc.fillRect(0,0,180,180);
 mc.strokeStyle="white";mc.lineWidth=13;
 mc.beginPath();mc.moveTo(90,0);mc.lineTo(90,180);mc.stroke();

 function dot(x,z,color,r){
  mc.fillStyle=color;mc.beginPath();
  mc.arc(90+x*.23,165-(z-player.z)*.055,r,0,Math.PI*2);
  mc.fill();
 }
 places.forEach(p=>dot(p.x,p.z,"#519e64",4));
 dot(player.x,player.z,"#e63e4b",6);
 if(order){
  const p=phase==="pickup"?order.from:order.to;
  dot(p.x,p.z,"#ffc83d",6);
 }
}

function loop(time){
 if(!running)return;
 const dt=last?Math.min((time-last)/1000,.04):.016;
 last=time;
 move(dt);drawWorld();drawMap();
 requestAnimationFrame(loop);
}

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
  e.preventDefault();
 if(e.key.toLowerCase()==="g")interact();
 if(e.key.toLowerCase()==="e")toggleRide();
});
addEventListener("keyup",e=>keys[e.key]=false);

document.querySelectorAll("[data-key]").forEach(button=>{
 const key=button.dataset.key;
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  button.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(eventName=>{
  button.addEventListener(eventName,()=>keys[key]=false);
 });
});
document.addEventListener("visibilitychange",()=>{keys={}});
</script>
</body>
</html>
